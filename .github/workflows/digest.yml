name: school-digest

on:
  schedule:
    # 8 PM America/Chicago = 01:00 UTC during CDT, 02:00 UTC during CST.
    # Run at both; the script's internal time check skips the wrong one.
    - cron: "0 1 * * *"
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print digest without sending"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Skip if not 8 PM in America/Chicago (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          HOUR=$(TZ=America/Chicago date +%H)
          echo "Local hour in America/Chicago: $HOUR"
          if [ "$HOUR" != "20" ]; then
            echo "Not 8 PM local — exiting cleanly."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify secrets are present
        id: verify
        run: |
          missing=""
          [ -z "${{ secrets.GMAIL_USER }}" ] && missing="$missing GMAIL_USER"
          [ -z "${{ secrets.GMAIL_APP_PASSWORD }}" ] && missing="$missing GMAIL_APP_PASSWORD"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && missing="$missing ANTHROPIC_API_KEY"
          if [ -n "$missing" ]; then
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "::error::Missing repo secrets:$missing"
            exit 1
          fi
          echo "All required secrets present."

      - name: Run digest
        id: run
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_CC: ${{ secrets.DIGEST_CC }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: |
          set +e
          python digest.py 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          # Trim to last 80 lines and redact any obvious creds before surfacing
          tail -80 run.log \
            | sed -E 's/(sk-ant-api03-[A-Za-z0-9_-]{6})[A-Za-z0-9_-]+/\1…REDACTED/g' \
            | sed -E 's/([A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+)/\1/g' \
            > tail.log
          {
            echo "tail<<EOF"
            cat tail.log
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Post failure as PR comment (workflow_dispatch only)
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const missing = `${{ steps.verify.outputs.missing }}`.trim();
            const tail = `${{ steps.run.outputs.tail }}`;
            let body = `### digest workflow failed\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n`;
            if (missing) {
              body += `**Missing repo secrets:** \`${missing}\`\n\nAdd them at ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/settings/secrets/actions`;
            } else if (tail) {
              body += `**Last 80 lines of \`digest.py\` output:**\n\n\`\`\`\n${tail}\n\`\`\``;
            } else {
              body += `Failed before \`Run digest\` produced any output. See run logs.`;
            }
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });
            if (prs.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs.data[0].number,
                body,
              });
            } else {
              core.warning("No open PR found for this branch — error not posted.");
              core.info(body);
            }

